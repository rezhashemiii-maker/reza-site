name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run unit and integration tests
        run: node --test tests/*.test.mjs

      - name: Build production artifact
        run: node tools/build.mjs
        env:
          OUTPUT_DIR: dist
          SITE_URL: https://rezhashemiii-maker.github.io/reza-site

      - name: Check generated site
        run: node tools/check-site.mjs dist
        env:
          SITE_URL: https://rezhashemiii-maker.github.io/reza-site

  browser-smoke:
    needs: test-and-verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependencies
        run: |
          python -m pip install -r tests/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Build browser test artifact
        run: node tools/build.mjs
        env:
          OUTPUT_DIR: dist
          SITE_URL: https://rezhashemiii-maker.github.io/reza-site
      - name: Test search, filters, demo and mobile contact
        run: python tests/browser_smoke.py dist
